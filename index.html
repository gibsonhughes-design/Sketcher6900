document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"56cf9b25-3e8a-4113-9d51-ec496cf37bd3\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>\n  html, body { margin: 0; padding: 0; height: 100%; }\n  a { color: #0072BC; }\n  a:hover { color: #003A70; }\n  input, textarea, select { font-family: Arial, Helvetica, sans-serif; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex;height:100vh;width:100vw;background:oklch(0.97 0.008 250);font-family:Arial, Helvetica, sans-serif;overflow:hidden;\">\n\n  <div style=\"width:264px;flex-shrink:0;background:#ffffff;border-right:1px solid oklch(0.88 0.012 250);display:flex;flex-direction:column;padding:16px 14px;gap:14px;overflow-y:auto;\">\n    <div style=\"display:flex;flex-direction:column;gap:8px;\">\n      <img src=\"82eca291-6fdc-4c0d-838d-4d1c8bf595cc\" alt=\"AUREOS\" style=\"width:132px;height:auto;display:block;\">\n      <div style=\"font-size:11px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#003A70;\">Defect Sketch Tool<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:5px;padding:9px 10px;border:1px solid #0072BC;border-radius:6px;background:white;\">\n      <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#003A70;\">File title<\u002Fdiv>\n      <input type=\"text\" value=\"{{ fileTitle }}\" sc-camel-on-change=\"{{ onChangeFileTitle }}\" placeholder=\"e.g. ECM1 336 Detailed Examination\" style=\"font-size:13px;font-weight:700;font-family:Arial, Helvetica, sans-serif;color:oklch(0.15 0.02 250);background:white;border:1px solid oklch(0.85 0.012 250);border-radius:4px;padding:6px 7px;outline:none;\">\n      <div style=\"font-size:10px;color:oklch(0.5 0.02 250);\">Names the PDF, saved file and photo zip.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:5px;padding:9px 10px;border:1px solid oklch(0.85 0.012 250);border-radius:6px;background:oklch(0.97 0.008 250);\">\n      <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.45 0.02 250);\">Sketch title<\u002Fdiv>\n      <textarea value=\"{{ title }}\" sc-camel-on-change=\"{{ onChangeTitle }}\" rows=\"2\" placeholder=\"e.g. ECM1 Br. 336 — Elevation A\" style=\"font-size:13px;font-weight:700;font-family:Arial, Helvetica, sans-serif;color:oklch(0.15 0.02 250);background:white;border:1px solid oklch(0.85 0.012 250);border-radius:4px;padding:6px 7px;resize:vertical;outline:none;line-height:1.3;\"><\u002Ftextarea>\n      <div style=\"font-size:10px;color:oklch(0.5 0.02 250);\">Printed at the top of the sheet on the PDF.<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;\">\n      <div sc-camel-on-click=\"{{ newFile }}\" style=\"grid-column:span 2;font-size:11px;font-weight:700;text-align:center;padding:8px 6px;border-radius:6px;cursor:pointer;background:white;color:#003A70;border:1px solid #0072BC;\" style-hover=\"background:oklch(0.96 0.02 250);\">+ New file<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ saveSketch }}\" style=\"font-size:11px;font-weight:700;text-align:center;padding:8px 6px;border-radius:6px;cursor:pointer;background:oklch(0.94 0.008 250);color:oklch(0.25 0.02 250);\" style-hover=\"background:oklch(0.9 0.008 250);\">Save file<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ triggerOpen }}\" style=\"font-size:11px;font-weight:700;text-align:center;padding:8px 6px;border-radius:6px;cursor:pointer;background:oklch(0.94 0.008 250);color:oklch(0.25 0.02 250);\" style-hover=\"background:oklch(0.9 0.008 250);\">Open file<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ exportPDF }}\" style=\"grid-column:span 2;font-size:11px;font-weight:700;text-align:center;padding:8px 6px;border-radius:6px;cursor:pointer;background:#0072BC;color:white;\" style-hover=\"background:#003A70;\">Export to PDF<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ downloadPhotos }}\" style=\"grid-column:span 2;font-size:11px;font-weight:700;text-align:center;padding:8px 6px;border-radius:6px;cursor:pointer;background:oklch(0.94 0.008 250);color:oklch(0.25 0.02 250);\" style-hover=\"background:oklch(0.9 0.008 250);\">{{ downloadPhotosLabel }}<\u002Fdiv>\n      <div style=\"grid-column:span 2;display:flex;flex-direction:column;gap:4px;padding:8px 9px;border-radius:6px;border:1px solid oklch(0.88 0.012 250);background:oklch(0.98 0.005 250);\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:6px;\">\n          <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.45 0.02 250);\">Save folder<\u002Fdiv>\n          <sc-if value=\"{{ folderSupported }}\" hint-placeholder-val=\"{{ true }}\">\n            <div sc-camel-on-click=\"{{ chooseFolder }}\" style=\"font-size:11px;font-weight:700;color:#0072BC;cursor:pointer;\">{{ folderAction }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;font-weight:600;color:oklch(0.25 0.02 250);word-break:break-all;\">{{ folderLabel }}<\u002Fdiv>\n        <sc-if value=\"{{ folderStatus }}\" hint-placeholder-val=\"{{ null }}\">\n          <div style=\"font-size:10px;color:#00813F;font-weight:600;\">{{ folderStatus }}<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <input type=\"file\" accept=\"image/*\" ref=\"{{ defectPhotoInputRef }}\" sc-camel-on-change=\"{{ onPickDefectPhoto }}\" style=\"display:none;\">\n      <input type=\"file\" accept=\"image/*\" ref=\"{{ imageInputRef }}\" sc-camel-on-change=\"{{ onPickImage }}\" style=\"display:none;\">\n      <div sc-camel-on-click=\"{{ pickImage }}\" style=\"grid-column:span 2;font-size:11px;font-weight:700;text-align:center;padding:8px 6px;border-radius:6px;cursor:pointer;background:white;border:1px solid oklch(0.85 0.012 250);color:oklch(0.25 0.02 250);\" style-hover=\"background:oklch(0.97 0.008 250);\">Insert image<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ addLocationSketch }}\" style=\"grid-column:span 2;font-size:11px;font-weight:700;text-align:center;padding:8px 6px;border-radius:6px;cursor:pointer;background:oklch(0.94 0.05 150);color:#00813F;\" style-hover=\"background:oklch(0.89 0.05 150);\">Location sketch<\u002Fdiv>\n      <div sc-camel-on-click=\"{{ newSketch }}\" style=\"grid-column:span 2;font-size:11px;font-weight:700;text-align:center;padding:8px 6px;border-radius:6px;cursor:pointer;background:white;border:1px solid oklch(0.85 0.012 250);color:oklch(0.25 0.02 250);\" style-hover=\"background:oklch(0.96 0.008 250);\">New sketch<\u002Fdiv>\n      <input type=\"file\" accept=\"application/json,.json\" ref=\"{{ openInputRef }}\" sc-camel-on-change=\"{{ onOpenFile }}\" style=\"display:none;\">\n    <\u002Fdiv>\n    <div style=\"font-size:10px;color:oklch(0.5 0.02 250);line-height:1.4;\">{{ autosaveNote }}<\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:6px;padding:10px;background:oklch(0.95 0.008 250);border-radius:6px;\">\n      <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.45 0.02 250);\">Pages in this file<\u002Fdiv>\n      <sc-for list=\"{{ pageTabs }}\" as=\"p\" hint-placeholder-count=\"1\">\n        <div sc-camel-on-click=\"{{ p.onClick }}\" style=\"{{ p.style }}\">\n          <div style=\"flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\">{{ p.label }}<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ p.onDelete }}\" title=\"Delete this page\" style=\"{{ p.deleteStyle }}\">×<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n      <div sc-camel-on-click=\"{{ addPage }}\" style=\"font-size:11px;font-weight:700;text-align:center;padding:7px;border-radius:5px;cursor:pointer;background:white;border:1px solid oklch(0.85 0.012 250);color:oklch(0.25 0.02 250);\" style-hover=\"background:oklch(0.97 0.008 250);\">+ Add page<\u002Fdiv>\n      <sc-if value=\"{{ offCanvas }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:10.5px;line-height:1.4;color:oklch(0.45 0.13 50);background:oklch(0.96 0.04 70);border-radius:5px;padding:6px 8px;\">Part of this sketch is outside the canvas.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ isDefectPage }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <div sc-camel-on-click=\"{{ togglePdfPanel }}\" style=\"display:flex;align-items:center;justify-content:space-between;cursor:pointer;margin-top:2px;\">\n            <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.45 0.02 250);\">Sketch size on PDF (this page)<\u002Fdiv>\n            <div style=\"font-size:11px;color:oklch(0.45 0.02 250);\">{{ pdfPanelChevron }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ pdfPanelClosed }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font-size:10px;color:oklch(0.5 0.02 250);line-height:1.35;\">{{ pdfPanelSummary }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ pdfPanelOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;gap:5px;\">\n          <div style=\"display:flex;gap:4px;flex-wrap:wrap;\">\n            <sc-for list=\"{{ pdfScaleOptions }}\" as=\"z\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-click=\"{{ z.onClick }}\" style=\"{{ z.style }}\">{{ z.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:10px;color:oklch(0.5 0.02 250);line-height:1.35;\">{{ pdfScaleNote }}<\u002Fdiv>\n          <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.45 0.02 250);margin-top:4px;\">Text size on PDF<\u002Fdiv>\n          <div style=\"display:flex;gap:4px;flex-wrap:wr         <sc-for list=\"{{ inspector.opacityOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ o.onClick }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ inspector.showTextBox }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.45 0.02 250);\">Size<\u002Fdiv>\n          <div style=\"display:flex;gap:4px;flex-wrap:wrap;\">\n            <sc-for list=\"{{ inspector.textBoxSizes }}\" as=\"ts\" hint-placeholder-count=\"5\">\n              <div sc-camel-on-click=\"{{ ts.onClick }}\" style=\"{{ ts.style }}\">{{ ts.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ inspector.textBoxBoxed.onClick }}\" style=\"{{ inspector.textBoxBoxed.style }}\">\n            <div style=\"{{ inspector.textBoxBoxed.boxStyle }}\">{{ inspector.textBoxBoxed.tick }}<\u002Fdiv>\n            <div>{{ inspector.textBoxBoxed.label }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ inspector.textBoxBold.onClick }}\" style=\"{{ inspector.textBoxBold.style }}\">\n            <div style=\"{{ inspector.textBoxBold.boxStyle }}\">{{ inspector.textBoxBold.tick }}<\u002Fdiv>\n            <div>{{ inspector.textBoxBold.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ inspector.showArc }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.45 0.02 250);\">Arch height<\u002Fdiv>\n          <input type=\"number\" min=\"1\" value=\"{{ inspector.arcRise }}\" sc-camel-on-change=\"{{ setArcRise }}\" style=\"font-size:13px;padding:7px;border:1px solid oklch(0.85 0.012 250);border-radius:5px;\">\n          <div style=\"font-size:11px;color:oklch(0.45 0.02 250);\">Span {{ inspector.arcSpan }} · or drag the handle at the crown<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;\">\n            <div sc-camel-on-click=\"{{ arcSemicircle }}\" style=\"flex:1;text-align:center;font-size:11px;font-weight:600;padding:7px;border-radius:5px;cursor:pointer;background:white;border:1px solid oklch(0.85 0.012 250);color:oklch(0.3 0.02 250);\">Semicircle<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ flipArc }}\" style=\"flex:1;text-align:center;font-size:11px;font-weight:600;padding:7px;border-radius:5px;cursor:pointer;background:white;border:1px solid oklch(0.85 0.012 250);color:oklch(0.3 0.02 250);\">Flip side<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ inspector.showImage }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex;flex-direction:column;gap:8px;\">\n          <div sc-camel-on-click=\"{{ toggleImageLock }}\" style=\"{{ inspector.lockStyle }}\">{{ inspector.lockLabel }}<\u002Fdiv>\n          <sc-if value=\"{{ inspector.imageLocked }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:11px;color:oklch(0.45 0.02 250);\">Size {{ inspector.imageWidth }} × {{ inspector.imageHeight }}<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ inspector.imageUnlocked }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-direction:column;gap:8px;\">\n              <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.45 0.02 250);\">Size<\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6px;\">\n                <label style=\"display:flex;flex-direction:column;gap:3px;font-size:10px;color:oklch(0.45 0.02 250);\">Width\n                  <input type=\"number\" value=\"{{ inspector.imageWidth }}\" sc-camel-on-change=\"{{ setImageWidth }}\" style=\"font-size:13px;padding:6px;border:1px solid oklch(0.85 0.012 250);border-radius:5px;width:100%;box-sizing:border-box;\">\n                <\u002Flabel>\n                <label style=\"display:flex;flex-direction:column;gap:3px;font-size:10px;color:oklch(0.45 0.02 250);\">Height\n                  <input type=\"number\" value=\"{{ inspector.imageHeight }}\" sc-camel-on-change=\"{{ setImageHeight }}\" style=\"font-size:13px;padding:6px;border:1px solid oklch(0.85 0.012 250);border-radius:5px;width:100%;box-sizing:border-box;\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <div sc-camel-on-click=\"{{ inspector.keepRatioRow.onClick }}\" style=\"{{ inspector.keepRatioRow.style }}\">\n                <div style=\"{{ inspector.keepRatioRow.boxStyle }}\">{{ inspector.keepRatioRow.tick }}<\u002Fdiv>\n                <div>{{ inspector.keepRatioRow.label }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:oklch(0.45 0.02 250);\">Opacity<\u002Fdiv>\n              <div style=\"display:flex;gap:4px;flex-wrap:wrap;\">\n                <sc-for list=\"{{ inspector.imageOpacityOptions }}\" as=\"op\" hint-placeholder-count=\"4\">\n                  <div sc-camel-on-click=\"{{ op.onClick }}\" style=\"{{ op.style }}\">{{ op.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <div style=\"display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid oklch(0.9 0.008 250);\">\n        <div style=\"font-size:11px;color:oklch(0.45 0.02 250);line-height:1.4;\">{{ inspector.dragNote }}<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ duplicateSelected }}\" style=\"text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:5px;background:oklch(0.95 0.008 250);color:oklch(0.3 0.02 250);cursor:pointer;\">Duplicate<\u002Fdiv>\n        <div sc-camel-on-click=\"{{ deleteSelected }}\" style=\"text-align:center;font-size:12px;font-weight:600;padding:8px;border-radius:5px;background:oklch(0.96 0.02 25);color:oklch(0.5 0.14 25);cursor:pointer;\">Delete<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;showGrid&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Canvas&quot;},&quot;paperOrientation&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Landscape&quot;,&quot;options&quot;:[&quot;Landscape&quot;,&quot;Portrait&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Canvas&quot;},&quot;toolbarPosition&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Top&quot;,&quot;options&quot;:[&quot;Top&quot;,&quot;Side&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Layout&quot;}}\">\nconst KEY_ITEMS = [\n  { id: 'new-fracture', label: 'Fracture', legendLabel: 'New / Worsened Fracture', scheduleLabel: 'Fracture', group: 'Masonry & Concrete', color: '#e11b22', geom: 'line', noVariants: true },\n  { id: 'os-fracture', label: 'O/S Fracture — NFD', legendLabel: 'O/S Fracture — NFD', scheduleLabel: 'Fracture', group: 'Masonry & Concrete', color: '#4aa8c4', geom: 'line', pickerHidden: true, noVariants: true },\n  { id: 'spalling', label: 'Spalling / Missing Brickwork', group: 'Masonry & Concrete', color: '#b3b3b3', geom: 'area' },\n  { id: 'open-joints', label: 'Open Joints', group: 'Masonry & Concrete', color: '#ffff00', geom: 'area' },\n  { id: 'bulging', label: 'Bulging / Out of Plumb / Displacement', group: 'Masonry & Concrete', color: '#b06a2c', geom: 'area' },\n  { id: 'wetness', label: 'Indications of Wetness', group: 'Masonry & Concrete', color: '#36a2bd', geom: 'area' },\n  { id: 'hollow', label: 'Hollow / Drummy', group: 'Masonry & Concrete', color: '#111111', geom: 'area', marker: 'H', noFill: true },\n  { id: 'date-tab', label: 'Date Tab / Avonguard', group: 'Masonry & Concrete', color: '#000000', geom: 'area', fixedSize: 18, noVariants: true },\n  { id: 'comment', label: 'General Comment', group: 'General', color: '#1a1a1a', geom: 'area', fixedSize: 26, noFill: true, noVariants: true },\n  { id: 'corrosion', label: 'Corrosion / Lamination', group: 'Metal', color: '#f5a800', geom: 'area' },\n  { id: 'metal-fracture', label: 'Fractures / Tears / Cracked Welds', group: 'Metal', color: '#e11b22', geom: 'line' },\n  { id: 'loss-of-section', label: 'Loss of Section / Buckling', group: 'Metal', color: '#ff0000', geom: 'area' }\n];\nconst KEY_BY_ID = {};\nKEY_ITEMS.forEach(k => { KEY_BY_ID[k.id] = k; });\n\nconst ORIENTATION_OPTIONS = ['Low Mileage', 'High Mileage', 'Upside', 'Downside'];\nconst DRAW_SUBTYPES = [\n  { id: 'straight', label: 'Straight' },\n  { id: 'polygon', label: 'Polygon' },\n  { id: 'freeform', label: 'Freeform' },\n  { id: 'pencil', label: 'Pencil (freehand)' },\n  { id: 'curve', label: 'Curve' }\n];\nconst CURVE_MODES = [\n  { id: 'smooth', label: 'Smooth curve' },\n  { id: 'arc', label: 'Arc (180°)' }\n];\nconst PENCIL_SMOOTHING = [\n  { id: 1, label: 'Raw' },\n  { id: 3, label: 'Light' },\n  { id: 6, label: 'Smooth' },\n  { id: 12, label: 'Very smooth' }\n];\n\n// 180° arch between a and b; h is the rise (negative = above the chord on screen).\nfunction arcPoints(a, b, h, steps) {\n  const n = steps || 48;\n  const L = Math.hypot(b.x - a.x, b.y - a.y) || 1;\n  const ux = (b.x - a.x) / L, uy = (b.y - a.y) / L;\n  const nx = -uy, ny = ux;\n  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;\n  const out = [];\n  for (let i = 0; i <= n; i++) {\n    const t = Math.PI * i / n;\n    const c = -Math.cos(t) * L / 2, s = Math.sin(t) * h;\n    out.push({ x: mx + ux * c + nx * s, y: my + uy * c + ny * s });\n  }\n  return out;\n}\nfunction arcApex(a, b, h) {\n  const L = Math.hypot(b.x - a.x, b.y - a.y) || 1;\n  return { x: (a.x + b.x) / 2 - (b.y - a.y) / L * h, y: (a.y + b.y) / 2 + (b.x - a.x) / L * h };\n}\n// default rise: a true semicircle, drawn above a left-to-right chord\nfunction defaultArcHeight(a, b) {\n  const L = Math.hypot(b.x - a.x, b.y - a.y);\n  return (b.x >= a.x ? -1 : 1) * L / 2;\n}\n// drop points closer than tol, keeping ends — tames jittery freehand strokes\nfunction simplifyStroke(pts, tol) {\n  if (pts.length < 3 || tol <= 1) return pts;\n  const out = [pts[0]];\n  for (let i = 1; i < pts.length - 1; i++) {\n    const l = out[out.length - 1];\n    if (Math.hypot(pts[i].x - l.x, pts[i].y - l.y) >= tol) out.push(pts[i]);\n  }\n  out.push(pts[pts.length - 1]);\n  return out;\n}\nconst THICKNESS_OPTIONS = [0.75, 1, 1.5, 2, 3, 5, 8];\nconst DASH_OPTIONS = [\n  { id: 'solid', label: 'Solid', value: '' },\n  { id: 'dashed', label: 'Dashed', value: '9 6' },\n  { id: 'dotted', label: 'Dotted', value: '2 5' }\n];\nconst HATCH_STYLES = [\n  { id: 'diagonal', label: 'Diagonal' },\n  { id: 'cross', label: 'Cross' },\n  { id: 'horizontal', label: 'Horizontal' },\n  { id: 'dots', label: 'Dots' },\n  { id: 'none', label: 'None' }\n];\nconst FILL_OPTIONS = [\n  { id: 'solid', label: 'Solid' },\n  { id: 'none', label: 'None' },\n  { id: 'diagonal', label: 'Diagonal' },\n  { id: 'cross', label: 'Cross' },\n  { id: 'horizontal', label: 'Horiz.' },\n  { id: 'dots', label: 'Dots' }\n];\nconst OPACITY_OPTIONS = [0.25, 0.5, 0.75, 1];\nconst INK_COLORS = [\n  { title: 'Black', value: '#1a1a1a' },\n  { title: 'Grey', value: '#8a8a8a' },\n  { title: 'White', value: '#ffffff' }\n];\nconst COLOR_SWATCHES = INK_COLORS.concat(\n  KEY_ITEMS.filter((k, i, arr) => arr.findIndex(o => o.color === k.color) === i).map(k => ({ title: k.label, value: k.color }))\n);\nconst TOOL_DEFS =
